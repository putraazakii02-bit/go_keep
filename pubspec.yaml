name: go_keep
description: "A Flutter Google Keep clone."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1 # atau versi terbaru
  http: ^1.6.0
  flutter_staggered_grid_view: ^0.7.0
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  uuid: ^4.5.1
  provider: ^6.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
